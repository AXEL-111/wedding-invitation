<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" fill="none">
  <defs>
    <linearGradient id="cornerGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D1"/>
      <stop offset="30%" stop-color="#E5C378"/>
      <stop offset="70%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8F6822"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g stroke="url(#cornerGoldGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Corner Structural Border Lines -->
    <path d="M6 150 L6 20 C6 12, 12 6, 20 6 L150 6" stroke-width="1.5" stroke-opacity="0.8"/>
    <path d="M14 140 L14 26 C14 19, 19 14, 26 14 L140 14" stroke-width="0.8" stroke-opacity="0.5" stroke-dasharray="3 3"/>

    <!-- Corner Apex Star Gem -->
    <g transform="translate(18, 18)">
      <polygon points="0,-9 2.5,-2.5 9,0 2.5,2.5 0,9 -2.5,2.5 -9,0 -2.5,-2.5" fill="url(#cornerGoldGrad)" filter="url(#goldGlow)"/>
      <circle cx="0" cy="0" r="1.5" fill="#FFF8E7"/>
    </g>

    <!-- Swirling Acanthus Vines -->
    <!-- Top arm vines -->
    <path d="M26 14 C40 14, 52 4, 70 8 C88 12, 98 2, 115 6 C128 8, 136 4, 148 6" stroke-width="1.2"/>
    <!-- Leaflets on top arm -->
    <path d="M48 10 C52 4, 60 4, 62 8 C58 12, 52 12, 48 10 Z" fill="url(#cornerGoldGrad)" fill-opacity="0.6"/>
    <path d="M78 8 C82 2, 90 2, 92 6 C88 10, 82 10, 78 8 Z" fill="url(#cornerGoldGrad)" fill-opacity="0.6"/>
    <path d="M104 6 C108 0, 116 0, 118 4 C114 8, 108 8, 104 6 Z" fill="url(#cornerGoldGrad)" fill-opacity="0.6"/>
    <circle cx="132" cy="6" r="2" fill="url(#cornerGoldGrad)"/>
    <circle cx="154" cy="6" r="2.5" fill="url(#cornerGoldGrad)"/>

    <!-- Left arm vines -->
    <path d="M14 26 C14 40, 4 52, 8 70 C12 88, 2 98, 6 115 C8 128, 4 136, 6 148" stroke-width="1.2"/>
    <!-- Leaflets on left arm -->
    <path d="M10 48 C4 52, 4 60, 8 62 C12 58, 12 52, 10 48 Z" fill="url(#cornerGoldGrad)" fill-opacity="0.6"/>
    <path d="M8 78 C2 82, 2 90, 6 92 C10 88, 10 82, 8 78 Z" fill="url(#cornerGoldGrad)" fill-opacity="0.6"/>
    <path d="M6 104 C0 108, 0 116, 4 118 C8 114, 8 108, 6 104 Z" fill="url(#cornerGoldGrad)" fill-opacity="0.6"/>
    <circle cx="6" cy="132" r="2" fill="url(#cornerGoldGrad)"/>
    <circle cx="6" cy="154" r="2.5" fill="url(#cornerGoldGrad)"/>

    <!-- Inner Diagonal Floral Arabesque -->
    <path d="M22 22 C35 35, 45 42, 60 38 C75 34, 80 48, 68 56 C56 64, 46 54, 42 46" stroke-width="1.2"/>
    <path d="M22 22 C35 35, 42 45, 38 60 C34 75, 48 80, 56 68 C64 56, 54 46, 46 42" stroke-width="1.2"/>
    
    <!-- Central Curled Rose / Bud Petal -->
    <path d="M48 48 C54 42, 62 44, 60 52 C58 60, 50 60, 46 54 C44 50, 46 46, 50 46" stroke-width="1.4" fill="url(#cornerGoldGrad)" fill-opacity="0.25"/>
    <circle cx="53" cy="51" r="2" fill="url(#cornerGoldGrad)"/>

    <!-- Delicate Whispering Tendrils -->
    <path d="M60 38 C70 30, 84 32, 90 24 C94 18, 88 14, 84 18" stroke-width="0.9"/>
    <path d="M38 60 C30 70, 32 84, 24 90 C18 94, 14 88, 18 84" stroke-width="0.9"/>

    <!-- Tiny Stardust Accents -->
    <circle cx="34" cy="24" r="1.2" fill="url(#cornerGoldGrad)"/>
    <circle cx="24" cy="34" r="1.2" fill="url(#cornerGoldGrad)"/>
    <circle cx="76" cy="32" r="1.5" fill="url(#cornerGoldGrad)"/>
    <circle cx="32" cy="76" r="1.5" fill="url(#cornerGoldGrad)"/>
    <circle cx="64" cy="64" r="1.8" fill="url(#cornerGoldGrad)"/>
  </g>
</svg>
