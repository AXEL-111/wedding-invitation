<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="45%" stop-color="#F2D48E"/>
      <stop offset="80%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8F6822"/>
    </linearGradient>
    <radialGradient id="starHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE8A3" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#E5C378" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Soft Radiant Halo -->
  <circle cx="24" cy="24" r="20" fill="url(#starHalo)"/>

  <!-- 8-Pointed Celestial Star -->
  <polygon points="24,2 26.5,18 42,24 26.5,30 24,46 21.5,30 6,24 21.5,18" fill="url(#starGrad)"/>
  <!-- Secondary 4 Diagonal Rays -->
  <polygon points="24,10 27,21 38,24 27,27 24,38 21,27 10,24 21,21" fill="url(#starGrad)" opacity="0.65"/>
  <!-- Bright Radiant Core -->
  <circle cx="24" cy="24" r="3" fill="#FFFFFF"/>
</svg>
